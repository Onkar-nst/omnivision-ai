services:
  - type: web
    name: omnivision-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false          # You set this manually in Render dashboard
    autoDeploy: true
